# Everything for this project lives in one Docker Desktop group: "nest-starter".
# Every name is prefixed with the project, so it is obvious what a container/volume belongs to.
#
#   npm run db:up        only PostgreSQL (API runs locally via `npm run dev`)
#   npm run stack:up     the whole stack in containers: PostgreSQL → migrations → API
#   npm run stack:down   stop and remove the stack (data volume is kept)
name: nest-starter

services:
  postgres:
    container_name: nest-starter-postgres
    # Keep the major version in sync with tests (test/setup/global-setup.ts) and production.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Override when 5432 is taken by another project: POSTGRES_PORT=55432 npm run db:up
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/…
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    container_name: nest-starter-migrate
    profiles: [app]
    image: nest-starter-api:local
    build: .
    command: ['node', 'dist/app/migrate.js']
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      JWT_SECRET: local-docker-secret-change-me-0123456789
    depends_on:
      postgres:
        condition: service_healthy

  api:
    container_name: nest-starter-api
    profiles: [app]
    # Same image as `migrate` (built once there), never pulled from a registry.
    image: nest-starter-api:local
    pull_policy: never
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      JWT_SECRET: local-docker-secret-change-me-0123456789
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
    name: nest-starter-postgres-data

networks:
  default:
    name: nest-starter-network
